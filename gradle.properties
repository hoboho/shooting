org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true

# Room exports versioned schema JSON so migrations can be validated in CI.
ksp.incremental=true

# Let AGP provision the compileSdk platform/build-tools on CI runners.
android.builder.sdkDownload=true

# Single source of truth for the 2.0.0 release baseline. CI pins build=0
# so the APK version remains exactly 2.0.0 in every job.
#   versionName = 2.0.0
#   versionCode = 2000000
shooting.versionBase=2.0
shooting.versionCodeBase=2000000
shooting.versionBuild=0
