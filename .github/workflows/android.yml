name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # --------------------------------------------------------------- fast gate
  # Runs without an Android SDK; catches resource/import/navigation mistakes.
  static:
    name: Offline source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source consistency checks
        run: python3 scripts/check_sources.py

  unit:
    name: JVM tests, lint & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages include the retired "tools" package,
          # which makes sdkmanager fail on current runners. AGP downloads the
          # required platform/build-tools itself once licences are accepted.
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Static analysis (Android lint)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Compile debug sources and build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Export Room schema JSON
        run: ./gradlew :app:kspDebugKotlin --no-daemon

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shooting-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------ on-device DB
  # Room/SQLite tests cannot run on a plain JVM. Kept separate so a flaky AVD
  # never blocks the fast gate.
  instrumented:
    name: Room/repository tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages include the retired "tools" package,
          # which makes sdkmanager fail on current runners. AGP downloads the
          # required platform/build-tools itself once licences are accepted.
          packages: 'platform-tools'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          avd-name: shooting-api34
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Print instrumented test XML
        if: always()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -print -exec cat {} \; || true

      - name: Collect generated PDF samples
        if: always()
        run: |
          mkdir -p qa-pdf-samples
          adb pull /sdcard/Android/data/ir.hoboho.shooting/files/qa qa-pdf-samples/ || true
          find qa-pdf-samples -type f -printf '%p %s bytes\n' || true

      - name: Upload PDF samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pdf-samples
          path: qa-pdf-samples/
          if-no-files-found: warn

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
