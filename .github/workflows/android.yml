name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the signed release APK to a GitHub Release (owner action only; off by default)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
  # Overrides shooting.versionBuild in gradle.properties, so every CI build has
  # a distinct versionName and a monotonically increasing versionCode.
  SHOOTING_VERSION_BUILD: 0

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------- fast gate
  # Runs without an Android SDK; catches resource/import/navigation mistakes.
  static:
    name: Offline source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source consistency checks
        run: python3 scripts/check_sources.py

  unit:
    name: JVM tests, lint & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        run: |
          BASE="$(sed -n 's/^shooting\.versionBase=//p' gradle.properties | tr -d '\r')"
          NAME="${BASE}.${SHOOTING_VERSION_BUILD}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "App version for this run: ${NAME}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages include the retired "tools" package,
          # which makes sdkmanager fail on current runners. AGP downloads the
          # required platform/build-tools itself once licences are accepted.
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon --stacktrace

      - name: Static analysis (Android lint)
        run: ./gradlew :app:lintDebug -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon

      - name: Compile debug sources and build APK
        run: ./gradlew :app:assembleDebug -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Export Room schema JSON
        run: ./gradlew :app:kspDebugKotlin -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shooting-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Every main push (plus manual dispatch or a [publish-apk] push) refreshes
      # the stable debug-latest APK. This is a debug-signed build, not a release.
      - name: Publish debug APK as a prerelease asset
        if: >-
          success() && (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' &&
             (github.ref == 'refs/heads/main' ||
              contains(github.event.head_commit.message, '[publish-apk]')))
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          TAG=debug-latest
          ASSET=Shooting-debug.apk
          NOTES="Debug build ${VERSION_NAME} from ${GITHUB_SHA}. Debug-signed; not a production-signed release."
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" \
              --prerelease \
              --title "Shooting debug APK" \
              --notes "$NOTES"
          fi

  # ------------------------------------------------------------ on-device DB
  # Room/SQLite tests cannot run on a plain JVM. Kept separate so a flaky AVD
  # never blocks the fast gate.
  instrumented:
    name: Room/repository tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages include the retired "tools" package,
          # which makes sdkmanager fail on current runners. AGP downloads the
          # required platform/build-tools itself once licences are accepted.
          packages: 'platform-tools'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          avd-name: shooting-api34
          # Instrumentation publishes PDFs to MediaStore.Downloads before Gradle
          # uninstalls the APKs; public Downloads survives the uninstall.
          # The runner executes each script line in its own `sh -c`, so this is
          # intentionally one line: it also preserves the Gradle exit status.
          script: |
            set +e; adb shell rm -rf /sdcard/Download/ShootingQA || true; ./gradlew :app:connectedDebugAndroidTest -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon --stacktrace; STATUS=$?; mkdir -p qa-pdf-samples; adb shell ls -laR /sdcard/Download/ShootingQA || true; adb pull /sdcard/Download/ShootingQA qa-pdf-samples/ || true; find qa-pdf-samples -type f -size 0 -delete; find qa-pdf-samples -type f -printf '%p %s bytes\n' || true; exit $STATUS

      - name: Print instrumented test XML
        if: always()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -print -exec cat {} \; || true

      - name: Upload PDF samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pdf-samples
          path: qa-pdf-samples/
          if-no-files-found: warn

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # ------------------------------------------------ rolling debug prerelease
  # Refreshes the debug-latest PRERELEASE assets only. Debug APKs are never
  # published as a versioned release; that is the signed release job's task.
  bundle:
    name: Publish download bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ unit, instrumented ]
    if: >-
      success() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         (github.ref == 'refs/heads/main' ||
          contains(github.event.head_commit.message, '[publish-apk]')))
      )
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all CI artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: Create ZIP bundle
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          {
            echo "Shooting debug bundle"
            echo "commit: $BUILD_SHA"
            echo "workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$BUILD_RUN"
            echo "generated (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Debug-signed CI build; not a production release."
          } > bundle/BUILD-INFO.txt
          cd bundle
          zip -r ../Shooting-latest.zip .

      - name: Publish ZIP as a prerelease asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does not check out the repository, so gh cannot infer it
          # from a git remote; specify it explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release upload debug-latest Shooting-latest.zip --clobber

      # NOTE: no versioned release is created from the debug APK here. The
      # versioned GitHub Release is produced by the "Signed release APK" job
      # below, and only after the repository owner explicitly requests it.

  # ------------------------------------------------------ signed release APK
  # Builds a REAL release variant, signs it with the long-lived key held in
  # repository Secrets, verifies it with apksigner, and publishes it only on an
  # explicitly approved workflow_dispatch from main. No debug APK is ever
  # published as a release, and no keystore/password is written to the repo,
  # logs or artifacts.
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: unit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint the release variant
        run: ./gradlew :app:lintRelease -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon

      - name: Locate apksigner (tooling check)
        run: |
          find_apksigner() {
            find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner 2>/dev/null \
              | sort -V | tail -n 1
          }
          APKSIGNER="$(find_apksigner)"
          if [ -z "$APKSIGNER" ] && command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "build-tools;37.0.0" > /dev/null 2>&1 || true
            APKSIGNER="$(find_apksigner)"
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android build-tools"
            exit 1
          fi
          "$APKSIGNER" version

      - name: Check release signing secrets
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] \
             && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Release signing secrets are not configured. See docs/RELEASE_SIGNING.md."
            exit 1
          fi

      - name: Decode release keystore into runner temp
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/shooting-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "RELEASE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pshooting.versionBuild="$SHOOTING_VERSION_BUILD" --no-daemon --stacktrace

      - name: Verify signature with apksigner
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APK" ]; then echo "::error::no release APK was produced"; exit 1; fi
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner was not found"; exit 1; fi
          case "$APK" in
            *debug*) echo "::error::a debug APK must never be used as the release APK"; exit 1 ;;
          esac
          "$APKSIGNER" verify --verbose --min-sdk-version 26 "$APK"
          echo "apksigner verify: OK"
          echo "Release APK verified: $(basename "$APK")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shooting-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------- owner-approved publish
  # A separate job so the repository owner's approval (environment reviewers
  # and/or the explicit dispatch flag) is required before anything is released.
  publish_release:
    name: Publish signed release (owner approval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ release, unit ]
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.event.inputs.publish_release == 'true'
          && github.ref == 'refs/heads/main' }}
    environment: release-approval
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified signed release APK
        uses: actions/download-artifact@v4
        with:
          name: shooting-release-apk
          path: release-apk

      - name: Create the versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.unit.outputs.version_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          TAG="v${VERSION_NAME}-release"
          APK="Shooting-release.apk"
          cp "$(find release-apk -name '*.apk' -type f | head -n 1)" "$APK"
          NOTES="Signed release APK ${VERSION_NAME}, built from main (${BUILD_SHA}). apksigner verification passed in CI. This is not a debug APK."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" \
              --title "Shooting ${VERSION_NAME} (signed)" \
              --notes "$NOTES"
          fi
