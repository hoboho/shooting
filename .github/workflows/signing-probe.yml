name: Signing capability probe

on:
  push:
    branches: [ 'arena/9d82cc5a-shouting' ]
  repository_dispatch:
    types: [ shooting-probe, publish-release ]

permissions:
  contents: read

jobs:
  dispatch_capability:
    name: Can GITHUB_TOKEN dispatch workflows?
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Probe workflow_dispatch REST endpoint (status only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/404148437/dispatches" \
            -d '{"ref":"main","inputs":{"publish_release":"false"}}')
          echo "workflow dispatch HTTP: $code"
          echo "event: $GITHUB_EVENT_NAME / action: ${{ github.event.action }}"

  payload_probe:
    name: Did repository_dispatch deliver a payload?
    runs-on: ubuntu-latest
    steps:
      - name: Report payload keys only (never values)
        env:
          HAS_PAYLOAD: ${{ github.event.client_payload != '' }}
        run: |
          echo "event: $GITHUB_EVENT_NAME"
          echo "action: ${{ github.event.action }}"
          echo "client_payload non-empty: $HAS_PAYLOAD"

  candidate_names:
    name: Alternative secret names (presence only)
    runs-on: ubuntu-latest
    steps:
      - name: Report which candidate names exist
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SHOOTING_KEYSTORE_BASE64: ${{ secrets.SHOOTING_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          for n in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                   KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                   ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                   SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD \
                   SHOOTING_KEYSTORE_BASE64 RELEASE_KEYSTORE KS_BASE64 STORE_PASSWORD SIGNING_KEY; do
            eval "v=\${$n:-}"
            if [ -n "$v" ]; then echo "$n: PRESENT"; fi
          done
          echo "(names not printed above are missing)"

  candidate_names_env:
    name: Alternative secret names at environment level
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - name: Report which candidate names exist
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SHOOTING_KEYSTORE_BASE64: ${{ secrets.SHOOTING_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          for n in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                   KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                   ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                   SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD \
                   SHOOTING_KEYSTORE_BASE64 RELEASE_KEYSTORE KS_BASE64 STORE_PASSWORD SIGNING_KEY; do
            eval "v=\${$n:-}"
            if [ -n "$v" ]; then echo "$n: PRESENT"; fi
          done
          echo "(names not printed above are missing)"
