name: Signing capability probe

on:
  push:
    branches: [ 'arena/9d82cc5a-shouting' ]

permissions:
  contents: read

jobs:
  secrets_write_probe:
    name: Explicit secrets:write permission
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      secrets: write
    steps:
      - name: Try to create then delete a dummy secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf 'dummy' | gh secret set SHOOTING_CAPABILITY_PROBE -R "$GITHUB_REPOSITORY" >/dev/null 2>/tmp/e
          rc=$?
          echo "secret set exit: $rc"
          head -2 /tmp/e
          gh secret delete SHOOTING_CAPABILITY_PROBE -R "$GITHUB_REPOSITORY" >/dev/null 2>&1
          set -e
