name: Signing capability probe

on:
  push:
    branches: [ 'arena/9d82cc5a-shouting' ]

permissions:
  contents: read

jobs:
  elevated_probe:
    name: Can elevated GITHUB_TOKEN write secrets/variables?
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - name: Probe secret write (dummy value, status only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf 'dummy' | gh secret set SHOOTING_CAPABILITY_PROBE -R "$GITHUB_REPOSITORY" >/dev/null 2>&1
          echo "gh secret set exit: $?"
          printf 'dummy' | gh variable set SHOOTING_CAPABILITY_PROBE -R "$GITHUB_REPOSITORY" >/dev/null 2>&1
          echo "gh variable set exit: $?"
          for p in actions/secrets/public-key actions/secrets actions/variables; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/$p")
            echo "$p -> HTTP $code"
          done
          set -e

  cleanup_probe:
    name: Clean up probe values
    needs: elevated_probe
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete dummy probe values if they were created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh secret delete SHOOTING_CAPABILITY_PROBE -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && echo "secret probe removed" || echo "secret probe absent/not removable"
          gh variable delete SHOOTING_CAPABILITY_PROBE -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && echo "variable probe removed" || echo "variable probe absent/not removable"
          set -e
